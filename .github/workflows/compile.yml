name: Compile
on:
  workflow_dispatch:
  push:
    paths:
      - './artifacts/C/*.c'
      - './artifacts/C/*.h'
      - './artifacts/C/*.cu'

jobs:
  compile:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            os_name: Linux
          - os: macos-15-intel
            os_name: macOS_Intel
          - os: macos-latest
            os_name: macOS_Apple_Silicon
          - os: windows-latest
            os_name: Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile 
        run: |
          make -C src distclean
          make -C src
          make -C src install

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pp-${{ matrix.os_name }}
          path: ./artifacts/lib/*/*
          retention-days: 1

  collect_files:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pp-*
          merge-multiple: true

      - name: Upload files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pp-all
          path: .
